spring:
  application:
    name: cart-service
  cloud:
    config:
      uri: http://localhost:8888
  config:
    import: configserver:http://localhost:8787
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5438/cart_db
    username: cart_db
    password: cart-password
    driver-class-name: org.postgresql.Driver
server:
  port: 8083
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
